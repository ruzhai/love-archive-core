name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # 构建期只需要一个占位密钥；生产运行时缺 JWT_SECRET 会启动即失败。
        env:
          JWT_SECRET: ci-placeholder-secret-not-used-at-runtime-0000
        run: npm run build
